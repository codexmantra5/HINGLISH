services:
  - type: web
    name: campusai-hinglish-router
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/server.py
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_INPUT_COST_PER_MILLION
        value: "0"
      - key: AI_OUTPUT_COST_PER_MILLION
        value: "0"
